<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>برنامه‌ی کلاسی من | ورود</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>برنامه‌ی کلاسی من</h1>
    <p class="sub">وارد شو تا ساعت و مکان کلاس‌هات رو یک‌جا ببینی.</p>

    <div class="card">
      <h2 id="formTitle">ورود</h2>
      <div id="authForm">
        <label for="username">نام کاربری</label>
        <input id="username" type="text" dir="auto" autocomplete="username" maxlength="20" autocapitalize="none" spellcheck="false">
        <p class="hint" id="userHint" hidden>۳ تا ۲۰ کاراکتر؛ فقط حروف فارسی، حروف انگلیسی و عدد. بدون فاصله و علامت.</p>

        <label for="password">رمز عبور</label>
        <input id="password" type="password" dir="auto" autocomplete="current-password" maxlength="30">
        <p class="hint" id="passHint" hidden>۶ تا ۳۰ کاراکتر، بدون فاصله. حروف بزرگ و کوچک انگلیسی با هم فرق دارن.</p>

        <button id="submitBtn" class="btn" type="button">ورود</button>
        <p id="msg" class="msg" role="alert"></p>
      </div>
      <p class="switch">
        <span id="switchText">حساب نداری؟</span>
        <button id="switchBtn" class="linkbtn" type="button">ثبت‌نام</button>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    let mode = 'login'; // 'login' | 'signup'

    const $ = id => document.getElementById(id);
    const msg = (text, type = 'err') => { $('msg').textContent = text; $('msg').className = 'msg ' + type; };

    // بعد از ورود: اگه کلاس ثبت کرده بود → برنامه، وگرنه → ثبت درس‌ها
    async function afterLogin() {
      try {
        location.replace((await hasClasses()) ? 'schedule.html' : 'add-classes.html');
      } catch (e) {
        msg('خطا در اتصال به سرور. دوباره تلاش کن.');
      }
    }

    function setMode(m) {
      mode = m;
      const login = m === 'login';
      $('formTitle').textContent = login ? 'ورود' : 'ثبت‌نام';
      $('submitBtn').textContent = login ? 'ورود' : 'ساخت حساب';
      $('switchText').textContent = login ? 'حساب نداری؟' : 'قبلاً ثبت‌نام کردی؟';
      $('switchBtn').textContent = login ? 'ثبت‌نام' : 'ورود';
      $('password').autocomplete = login ? 'current-password' : 'new-password';
      $('userHint').hidden = login;
      $('passHint').hidden = login;
      msg('');
    }

    function friendlyError(error) {
      const m = (error.message || '').toLowerCase();
      if (m.includes('invalid login')) return 'نام کاربری یا رمز عبور اشتباهه.';
      if (m.includes('already registered') || m.includes('already been registered')) return 'این نام کاربری قبلاً گرفته شده. یکی دیگه انتخاب کن.';
      if (m.includes('rate limit') || m.includes('too many')) return 'تلاش‌های زیاد. چند دقیقه بعد دوباره امتحان کن.';
      if (m.includes('email not confirmed')) return 'تأیید ایمیل توی Supabase خاموش نیست؛ باید خاموشش کنی.';
      return 'مشکلی پیش اومد. دوباره تلاش کن.';
    }

    async function submit() {
      const username = $('username').value;
      const password = $('password').value;

      // در ثبت‌نام قوانین کامل چک می‌شه؛ در ورود فقط خالی نبودن
      const uErr = mode === 'signup' ? validateUsername(username) : (normalizeUsername(username) ? '' : 'نام کاربری رو وارد کن.');
      if (uErr) { msg(uErr); return; }
      const pErr = mode === 'signup' ? validatePassword(password) : (password ? '' : 'رمز عبور رو وارد کن.');
      if (pErr) { msg(pErr); return; }

      $('submitBtn').disabled = true;
      msg('');

      const email = await usernameToEmail(username);

      if (mode === 'login') {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) { msg(friendlyError(error)); $('submitBtn').disabled = false; return; }
        await afterLogin();
      } else {
        const { data, error } = await db.auth.signUp({ email, password });
        if (error) { msg(friendlyError(error)); $('submitBtn').disabled = false; return; }
        // اگه کاربر تکراری باشه و تأیید ایمیل خاموش باشه، Supabase خطا می‌ده؛ در غیر این‌صورت session هست
        if (!data.session) {
          msg('حساب ساخته نشد. تأیید ایمیل (Confirm email) توی Supabase باید خاموش باشه.');
          $('submitBtn').disabled = false;
          return;
        }
        await afterLogin();
      }
    }

    $('submitBtn').addEventListener('click', submit);
    $('authForm').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    $('switchBtn').addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

    // اگه از قبل لاگین بود، مستقیم مسیریابی کن
    db.auth.getSession().then(({ data }) => { if (data.session) afterLogin(); });
  </script>
</body>
</html>

function splitStmts(line){

  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){cur+=ch;if(ch==="'"){if(line[i+1]==="'"){cur+="'";i++}else q=false}continue}
    if(ch==="%")break;
